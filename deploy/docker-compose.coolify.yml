services:
  app:
    image: ghcr.io/roberteinsle/spendenquittung:${APP_TAG:-latest}
    pull_policy: always
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GOTENBERG_URL: http://gotenberg:3000
      TAILSCALE_ONLY: "true"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"
      LOG_CHANNEL: stderr
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_started
      gotenberg:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  worker:
    image: ghcr.io/roberteinsle/spendenquittung:${APP_TAG:-latest}
    pull_policy: always
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=120", "--sleep=3"]
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GOTENBERG_URL: http://gotenberg:3000
      TAILSCALE_ONLY: "true"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      AUTORUN_ENABLED: "false"
      LOG_CHANNEL: stderr
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_started
      app:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - "gotenberg"
      - "--api-timeout=60s"
      - "--chromium-disable-javascript=false"
      - "--chromium-allow-list=file:///.*"
    restart: unless-stopped

volumes:
  app-storage:
  db-data:
